name: Firmware build and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Compute firmware version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          base="$(sed -n 's/^#define FW_VERSION "\(.*\)"/\1/p' firmware/base-node/config.h)"
          tag_at_head="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n1 || true)"
          if [ -n "$tag_at_head" ]; then
            version="$tag_at_head"
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            version="$base"
          else
            latest="$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n1 || true)"
            IFS=. read -r major minor patch <<<"$base"
            if [ -z "$latest" ]; then
              version="$major.$minor.$((patch + 1))"
            else
              IFS=. read -r lmajor lminor lpatch <<<"$latest"
              if [ "$major" -gt "$lmajor" ] || { [ "$major" -eq "$lmajor" ] && [ "$minor" -gt "$lminor" ]; }; then
                version="$base"
              else
                version="$lmajor.$lminor.$((lpatch + 1))"
              fi
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Computed version: $version"

  build:
    name: Build firmware
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Regenerate and verify embedded web assets
        run: |
          node web/build_assets.mjs
          if ! git diff --exit-code -- firmware/base-node/web_assets.cpp firmware/base-node/web_assets.h; then
            echo "::error::web_assets.cpp/.h are stale. Run 'node web/build_assets.mjs' and commit the result."
            exit 1
          fi

      - name: Check flasher scripts
        run: |
          npm --prefix web run check:flasher
          python3 -m py_compile web/flasher/build_pages.py

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.1.1"

      - name: Cache Arduino core and libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ runner.os }}-esp32-3.1.0-${{ hashFiles('.github/workflows/firmware.yml') }}
          restore-keys: |
            arduino-${{ runner.os }}-esp32-3.1.0-

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.1.0
          arduino-cli lib install \
            "LoRa@0.8.0" \
            "Adafruit GFX Library@1.11.11" \
            "Adafruit SSD1306@2.5.13" \
            "Adafruit BusIO@1.17.0" \
            "ArduinoJson@7.2.1" \
            "PubSubClient@2.8.0"

      - name: Inject firmware version
        run: |
          version="${{ needs.version.outputs.version }}"
          sed -i "s/^#define FW_VERSION .*/#define FW_VERSION \"$version\"/" \
            firmware/base-node/config.h firmware/remote-node/config.h
          grep '^#define FW_VERSION' firmware/base-node/config.h firmware/remote-node/config.h

      - name: Build remote node
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:ttgo-lora32:Revision=TTGO_LoRa32_v21new,UploadSpeed=460800" \
            --output-dir "$RUNNER_TEMP/build-remote" \
            firmware/remote-node

      - name: Build base node
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:ttgo-lora32:Revision=TTGO_LoRa32_v21new,UploadSpeed=460800" \
            --build-property "upload.maximum_size=1835008" \
            --output-dir "$RUNNER_TEMP/build-base" \
            firmware/base-node

      - name: Collect release assets
        run: |
          set -euo pipefail
          DIST="$RUNNER_TEMP/firmware-dist"
          mkdir -p "$DIST"

          cp "$RUNNER_TEMP/build-base/base-node.ino.bin" "$DIST/base-node.bin"
          cp "$RUNNER_TEMP/build-base/base-node.ino.merged.bin" "$DIST/base-node-full.bin"
          cp "$RUNNER_TEMP/build-remote/remote-node.ino.bin" "$DIST/remote-node.bin"
          cp "$RUNNER_TEMP/build-remote/remote-node.ino.merged.bin" "$DIST/remote-node-full.bin"

          BASE_VERSION="$(sed -n 's/^#define FW_VERSION "\(.*\)"/\1/p' firmware/base-node/config.h)"
          REMOTE_VERSION="$(sed -n 's/^#define FW_VERSION "\(.*\)"/\1/p' firmware/remote-node/config.h)"
          if [ "$BASE_VERSION" != "$REMOTE_VERSION" ]; then
            echo "::error::Base and remote FW_VERSION values differ: $BASE_VERSION vs $REMOTE_VERSION"
            exit 1
          fi

          cat > "$DIST/README.txt" <<EOF
          Tuya LoRa Bridge firmware
          Version: $BASE_VERSION
          Commit:  $GITHUB_SHA
          Built:   $(date -u +%Y-%m-%dT%H:%M:%SZ)

          SD-card update images (copy to the card root):
            base-node.bin
            remote-node.bin

          Full 4 MB USB flash images (bootloader + partition table + app):
            base-node-full.bin
            remote-node-full.bin

          Verify the downloads with:
            sha256sum -c SHA256SUMS.txt        # Linux
            shasum -a 256 -c SHA256SUMS.txt    # macOS
          EOF

          (cd "$DIST" && sha256sum *.bin > SHA256SUMS.txt)
          ls -lh "$DIST"

      - name: Upload firmware bundle
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: ${{ runner.temp }}/firmware-dist
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: [build, version]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download firmware bundle
        uses: actions/download-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Tuya LoRa Bridge ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            ## Tuya LoRa Bridge ${{ needs.version.outputs.version }}

            Automated firmware build from commit `${{ github.sha }}`.

            ### Which image goes where

            | Image | Node | Use |
            |---|---|---|
            | `base-node.bin` | Base / receiver | SD card or Wi-Fi OTA application image |
            | `remote-node.bin` | Remote / Tuya AP proxy | SD card or Wi-Fi OTA application image |
            | `base-node-full.bin` | Base / receiver | Full 4 MB USB image (bootloader + partition table + app) |
            | `remote-node-full.bin` | Remote / Tuya AP proxy | Full 4 MB USB image (bootloader + partition table + app) |
            | `SHA256SUMS.txt` | — | SHA-256 checksums |

            ### SD-card update

            1. Copy `base-node.bin` to the base node's SD-card root.
            2. Copy `remote-node.bin` to the remote node's SD-card root. One card can hold both files.
            3. Insert the card and reset the board. It shows a 10-second countdown, flashes the matching file, shows `UPDATE OK`, renames the file to `.done`, and reboots.
            4. Keep the card inserted and power on until the update finishes.

            ### Wi-Fi OTA

            Open `/ota` on the node and upload the matching application image
            (`base-node.bin` or `remote-node.bin`). The node writes the inactive OTA
            slot, verifies it, and reboots. Do not upload a `*-full.bin` image through
            `/ota`.

            - Base: `http://<base-ip>/ota`
            - Remote: `http://192.168.4.1/ota` (connect to the remote AP)

            ### Full USB flash and recovery

            Use the attached `-full.bin` files with esptool or the ESP32 Flash Download
            Tool. The full image is written at address `0x0` and erases NVS/LittleFS,
            including WiFi, MQTT, Home Assistant and profile settings.

            Hosted Web Serial flasher: <https://gyenchev.github.io/tuya-lora-bridge/>  
            Desktop Chrome/Edge and a USB data cable are required. The hosted
            flasher includes the latest 10 releases and lets you choose one.

            ### Verify

            Check the downloaded files against `SHA256SUMS.txt`, and see the
            [firmware README](https://github.com/gyenchev/tuya-lora-bridge/blob/main/firmware/README.md) for details.
          files: dist/*
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
          draft: false
          prerelease: false

  pages:
    name: Deploy Web Serial flasher to GitHub Pages
    needs: [build, version]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download firmware bundle
        uses: actions/download-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: dist

      - name: Assemble Pages site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/pages-site"
          mkdir -p "$SITE/firmware"
          cp web/flasher/index.html "$SITE/"
          cp web/flasher/flasher.js "$SITE/"
          cp -R web/flasher/vendor "$SITE/vendor"

          python3 web/flasher/build_pages.py             --site "$SITE"             --dist dist             --current-tag "${{ needs.version.outputs.tag }}"             --version "${{ needs.version.outputs.version }}"             --commit "$GITHUB_SHA"             --built "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          find "$SITE/firmware" -maxdepth 2 -type f -printf '%P %s bytes\n' | sort | sed -n '1,80p'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
